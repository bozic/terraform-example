name: Test Terraform Modules

on:
  workflow_call:
    inputs:
      modules:
        description: "JSON array of modules to test"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  test-module:
    name: "[${{ matrix.module_name }}] Test"
    runs-on: ubuntu-latest
    # Restore release environment selection once it is provisioned with Azure test credentials.
    environment: snapshot
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.modules) }}
    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Read module version
        id: version
        working-directory: ${{ matrix.module }}
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Module version: $VERSION"

      - name: Run Terraform tests
        working-directory: ${{ matrix.module }}
        run: |
          test_count=0
          fail_count=0
          for dir in examples/*/; do
            if [ -d "$dir/tests" ]; then
              echo "::group::Testing $dir"
              terraform -chdir="$dir" init
              if terraform -chdir="$dir" test; then
                echo "✓ $dir passed"
              else
                echo "✗ $dir failed"
                fail_count=$((fail_count+1))
              fi
              test_count=$((test_count+1))
              echo "::endgroup::"
            fi
          done
          echo "Ran $test_count test suite(s), $fail_count failure(s)"
          if [ "$fail_count" -gt 0 ]; then exit 1; fi

      - name: Post test summary
        if: always()
        run: |
          echo "### [${{ matrix.module_name }}] v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Module: \`${{ matrix.module }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
